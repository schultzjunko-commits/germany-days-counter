<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>やることリスト</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<meta name="theme-color" content="#fbf3e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="やることリスト">
<style>
  :root {
    --bg: #fbf3e9;
    --card: #fffaf3;
    --accent: #d98a5f;
    --accent-dark: #b8663d;
    --text: #5b4636;
    --text-light: #8a7362;
    --border: #ecdcc7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(184, 102, 61, 0.08);
    margin-top: 40px;
  }

  .icon {
    font-size: 40px;
    margin-bottom: 8px;
    text-align: center;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 28px;
    color: var(--accent-dark);
    font-weight: 600;
    text-align: center;
  }

  form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }

  input[type="text"] {
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    min-width: 0;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s ease;
    white-space: nowrap;
  }

  button:hover {
    background: var(--accent-dark);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fdf0e2;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  li input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 2px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    background: #fff;
  }

  li input[type="checkbox"]:checked {
    background: var(--accent);
  }

  li input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  li .task-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }

  li.done .task-text {
    text-decoration: line-through;
    color: var(--text-light);
    opacity: 0.6;
  }

  li .delete-btn {
    background: none;
    color: var(--text-light);
    font-size: 18px;
    padding: 2px 8px;
    line-height: 1;
  }

  li .delete-btn:hover {
    background: none;
    color: var(--accent-dark);
  }

  .empty {
    text-align: center;
    color: var(--text-light);
    font-size: 14px;
    padding: 16px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📝</div>
    <h1>やることリスト</h1>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="タスクを入力…" autocomplete="off">
      <button type="submit">追加</button>
    </form>

    <ul id="task-list"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'todoTasks';
    const form = document.getElementById('task-form');
    const input = document.getElementById('task-input');
    const list = document.getElementById('task-list');

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    let tasks = loadTasks();

    function render() {
      list.innerHTML = '';

      if (tasks.length === 0) {
        list.innerHTML = '<div class="empty">タスクはまだありません🌱</div>';
        return;
      }

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = task.done ? 'done' : '';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => {
          task.done = checkbox.checked;
          saveTasks(tasks);
          render();
        });

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.addEventListener('click', () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks(tasks);
          render();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text, done: false });
      saveTasks(tasks);
      input.value = '';
      render();
      input.focus();
    });

    render();
  </script>
</body>
</html>
